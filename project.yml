name: FSDMXVision
include:
  - project.local.yml
options:
  bundleIdPrefix: com.fsdmxvision
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    exactVersion: 0.26.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4

projectReferences:
  Syphon:
    path: Vendor/Syphon-Framework/Syphon.xcodeproj

targets:
  FSDMXVision:
    type: application
    platform: macOS
    sources:
      - path: FSDMXVision/FSDMXVision
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fsdmxvision.app
        PRODUCT_NAME: FSDMXVision
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Partial Info.plist merged with the generated one; carries custom Sparkle keys
        # (SUFeedURL / SUPublicEDKey / SUEnableAutomaticChecks) that INFOPLIST_KEY_* can't inject.
        INFOPLIST_FILE: FSDMXVision/Info-Sparkle.plist
        INFOPLIST_KEY_CFBundleDisplayName: FS DMX Vision
        INFOPLIST_KEY_NSMicrophoneUsageDescription: FS DMX Vision analyzes live audio to drive visuals.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: FS DMX Vision can expose an optional LAN control server when you enable it in settings.
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 FS Tech. All rights reserved."
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: FlyingFox
        product: FlyingFox
      - package: Sparkle
        product: Sparkle
      - target: Syphon/Syphon
        embed: true

  FSDMXVisionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FSDMXVision/FSDMXVisionTests
    dependencies:
      - target: FSDMXVision
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.fsdmxvision.tests
        PRODUCT_NAME: FSDMXVisionTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FSDMXVision:
    build:
      targets:
        FSDMXVision: all
        FSDMXVisionTests: [test]
    test:
      targets:
        - name: FSDMXVisionTests
