# Full FSDMXVision unit tests on macOS (Gate 1.3)
# Complements show-package-smoke.yml (narrow tests) with the full FSDMXVisionTests suite.

name: Unit Tests (macOS)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project (CI signing stub)
        run: |
          cp -f project.local.yml.example project.local.yml
          xcodegen generate

      - name: Run full test suite
        run: |
          xcodebuild test \
            -project FSDMXVision.xcodeproj \
            -scheme FSDMXVision \
            -destination 'platform=macOS'
