name: release-macos-beta

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1a*"

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cp -f project.local.yml.example project.local.yml
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project "CosmicVisualizer.xcodeproj" -scheme "CosmicVisualizer" -configuration Release -derivedDataPath build

      - name: Package ZIP + DMG (unsigned — see docs/release-runbook.md for signing)
        run: |
          bash scripts/release/package-beta.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmicVisualizer-beta
          path: dist/*
